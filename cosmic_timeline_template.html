<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙タイムライン — 138億年の旅</title>
<style>
  :root {
    --ink: #e8e6f0;
    --dim: #8a87a3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: #030308;
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    overflow-x: hidden;
  }

  /* ===== 背景レイヤー ===== */
  #stars {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
  }
  #glow {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    transition: background 0.6s ease;
  }

  /* ===== 固定HUD:時間カウンター ===== */
  #hud {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
    pointer-events: none;
    width: 100%;
  }
  #era-label {
    font-size: 12px;
    letter-spacing: 0.35em;
    color: var(--dim);
    margin-bottom: 2px;
    text-indent: 0.35em;
  }
  #time-display {
    font-size: clamp(26px, 7vw, 44px);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-shadow: 0 0 24px rgba(140,150,255,0.35);
    font-variant-numeric: tabular-nums;
  }

  /* ===== 右側の進行バー ===== */
  #rail {
    position: fixed;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    height: 62vh;
    width: 2px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
  }
  #rail-fill {
    position: absolute; top: 0; left: 0;
    width: 100%;
    background: linear-gradient(#ffd9a0, #9db4ff);
    border-radius: 2px;
    height: 0%;
  }
  .rail-dot {
    position: absolute;
    left: 50%;
    width: 7px; height: 7px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #55536e;
    border: 1px solid #030308;
    cursor: pointer;
    pointer-events: auto;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .rail-dot.active {
    background: #ffe9c4;
    box-shadow: 0 0 10px rgba(255,220,160,0.8);
  }

  /* ===== イベントセクション ===== */
  .event {
    position: relative;
    z-index: 10;
    min-height: 105vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20vh 24px;
  }
  .event .icon {
    font-size: clamp(48px, 12vw, 84px);
    margin-bottom: 18px;
    filter: drop-shadow(0 0 22px rgba(160,170,255,0.45));
  }
  .event .when {
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--dim);
    margin-bottom: 10px;
    text-indent: 0.3em;
  }
  .event h2 {
    font-size: clamp(30px, 8vw, 56px);
    font-weight: 600;
    letter-spacing: 0.08em;
    margin-bottom: 20px;
    line-height: 1.3;
  }
  .event p {
    max-width: 560px;
    font-size: clamp(15px, 4vw, 17px);
    line-height: 2.1;
    color: #c8c5da;
  }
  .event .trivia {
    margin-top: 26px;
    max-width: 520px;
    font-size: 13.5px;
    line-height: 1.9;
    color: #9a96b8;
    border-top: 1px solid rgba(255,255,255,0.14);
    padding-top: 16px;
  }
  .event .trivia::before {
    content: "✦ ";
    color: #ffd9a0;
  }

  /* フェードイン */
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 1s ease, transform 1s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* ===== ヒーロー ===== */
  #hero {
    min-height: 100vh;
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center;
    padding: 0 24px;
  }
  #hero .sub {
    font-size: 13px; letter-spacing: 0.5em; text-indent: 0.5em;
    color: var(--dim); margin-bottom: 22px;
  }
  #hero h1 {
    font-size: clamp(34px, 9vw, 72px);
    font-weight: 600;
    letter-spacing: 0.12em;
    line-height: 1.4;
    background: linear-gradient(180deg, #fff 30%, #a8b2ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #hero .invite {
    margin-top: 34px;
    font-size: 15px;
    color: #b7b3cf;
    line-height: 2;
  }
  #hero .arrow {
    margin-top: 40px;
    font-size: 22px;
    color: #ffd9a0;
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(10px); opacity: 1; }
  }

  #footer {
    position: relative; z-index: 10;
    text-align: center;
    padding: 12vh 24px 16vh;
    color: var(--dim);
    font-size: 13px;
    line-height: 2.2;
    letter-spacing: 0.1em;
  }

  /* ===== レイヤー ===== */
  .layer-tag {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    padding: 5px 14px;
    border-radius: 14px;
    border: 1px solid;
    margin-bottom: 16px;
  }
  /* レイヤーごとの色は events.json のレイヤー定義からJSで自動生成されます */

  #layer-chips {
    display: flex;
    justify-content: center;
    gap: 8px;
    max-width: 460px;
    margin: 0 auto 22px;
  }
  .layer-chip {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.18);
    color: #6b6885;
    font-family: inherit;
    font-size: 12.5px;
    letter-spacing: 0.1em;
    padding: 7px 14px;
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .layer-chip.on {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,220,160,0.6);
    color: var(--ink);
  }
  .layer-chip:focus-visible { outline: 2px solid #ffd9a0; outline-offset: 2px; }

  /* ===== 目次ボタンとジャンプメニュー ===== */
  #menu-btn {
    position: fixed;
    top: 14px; left: 14px;
    z-index: 40;
    background: rgba(20, 18, 40, 0.75);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.15em;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.3s;
  }
  #menu-btn:hover { background: rgba(60, 55, 100, 0.85); }
  #menu-btn:focus-visible { outline: 2px solid #ffd9a0; outline-offset: 2px; }

  #menu-overlay {
    position: fixed; inset: 0;
    z-index: 50;
    background: rgba(3, 3, 10, 0.92);
    backdrop-filter: blur(10px);
    display: none;
    overflow-y: auto;
    padding: 70px 20px 40px;
  }
  #menu-overlay.open { display: block; }
  #menu-close {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 51;
    background: none;
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--ink);
    font-size: 18px;
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
  }
  #menu-close:focus-visible { outline: 2px solid #ffd9a0; outline-offset: 2px; }
  #menu-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    color: var(--dim);
    margin-bottom: 24px;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 460px;
    margin: 0 auto 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--ink);
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.25s, border-color 0.25s;
  }
  .menu-item:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,220,160,0.5);
  }
  .menu-item:focus-visible { outline: 2px solid #ffd9a0; outline-offset: 2px; }
  .menu-item .mi-icon { font-size: 24px; flex-shrink: 0; }
  .menu-item .mi-title { font-size: 15px; font-weight: 600; letter-spacing: 0.05em; }
  .menu-item .mi-when { font-size: 11.5px; color: var(--dim); letter-spacing: 0.1em; margin-top: 2px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { transition: none; opacity: 1; transform: none; }
    #hero .arrow { animation: none; }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="glow"></div>

<button id="menu-btn">☰ 目次</button>
<div id="menu-overlay">
  <button id="menu-close" aria-label="閉じる">✕</button>
  <div id="menu-title">138億年の目次</div>
  <div id="layer-chips"></div>
  <div id="menu-list"></div>
</div>

<div id="hud">
  <div id="era-label"></div>
  <div id="time-display"></div>
</div>

<div id="rail"><div id="rail-fill"></div></div>

<section id="hero">
  <div class="sub">COSMIC TIMELINE</div>
  <h1>138億年の旅</h1>
  <div class="invite">下にスクロールすると、時間が流れはじめます。<br>ビッグバンから、未来の宇宙まで。</div>
  <div class="arrow">▼</div>
</section>

<div id="events"></div>

<section id="footer">
  ここまでで138億年 ＋ 未来100億年の旅でした。<br>
  この一本の線の上に、神話も、日本史も、あなたの人生も重ねられます。
</section>

// ============================================================
// 時間の表示フォーマット
// ============================================================
function formatTime(ybp) {
  if (ybp < 0) { // 未来
    const y = -ybp;
    if (y >= 1e8) return (y / 1e8).toFixed(y >= 1e9 ? 0 : 1).replace(/\.0$/, "") + "億年後";
    if (y >= 1e4) return Math.round(y / 1e4).toLocaleString() + "万年後";
    return Math.round(y).toLocaleString() + "年後";
  }
  if (ybp >= 1e8) {
    const oku = ybp / 1e8;
    return (oku >= 10 ? Math.round(oku) : oku.toFixed(1).replace(/\.0$/, "")) + "億年前";
  }
  if (ybp >= 1e4) return Math.round(ybp / 1e4).toLocaleString() + "万年前";
  if (ybp <= 0.5) return "現在";
  const year = Math.round(2026 - ybp);
  if (year >= 1) return "西暦 " + year + "年";
  return "紀元前 " + (1 - year) + "年頃";
}

// 対数スケール変換(スクロール補間用)
function toLog(ybp) {
  if (ybp > 0) return Math.log10(ybp + 1);          // 過去: 正
  if (ybp < 0) return -Math.log10(-ybp + 1) * 0.4;  // 未来: 負(圧縮)
  return 0;
}
function fromLog(v) {
  if (v > 0) return Math.pow(10, v) - 1;
  if (v < 0) return -(Math.pow(10, -v / 0.4) - 1);
  return 0;
}

// ============================================================
// レイヤー定義(colorはタグ・アイコン光彩・目次の色に使われます)
// events.json の "layers" で新しいレイヤーを追加できます
// ============================================================
let LAYERS = {
  cosmos:  { label: "宇宙",   symbol: "🌌", color: "#9db4ff", on: true },
  astro:   { label: "占星術", symbol: "☿",  color: "#c9a6ff", on: true },
  myth:    { label: "神話",   symbol: "⛩",  color: "#ffc46a", on: true },
  history: { label: "日本史", symbol: "🗾", color: "#ff9d8a", on: true }
};

// ============================================================
// DOM生成
// ============================================================
const eventsRoot = document.getElementById("events");
const rail = document.getElementById("rail");
let sections = [];
let dots = [];

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

// レイヤー色のCSSを動的生成(JSONで追加したレイヤーにも自動対応)
function injectLayerStyles() {
  let css = "";
  Object.entries(LAYERS).forEach(([key, L]) => {
    if (key === "cosmos" || !L.color) return;
    css += `
      .layer-${key} .layer-tag { color: ${L.color}; border-color: ${hexToRgba(L.color, 0.5)}; }
      .layer-${key} .icon { filter: drop-shadow(0 0 22px ${hexToRgba(L.color, 0.5)}); }
      .menu-item.mi-${key} { border-left: 3px solid ${hexToRgba(L.color, 0.6)}; }`;
  });
  let tag = document.getElementById("layer-styles");
  if (!tag) {
    tag = document.createElement("style");
    tag.id = "layer-styles";
    document.head.appendChild(tag);
  }
  tag.textContent = css;
}

const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
}, { threshold: 0.15 });

function buildTimeline() {
  eventsRoot.innerHTML = "";
  dots.forEach(d => d.remove());
  sections = [];
  dots = [];
  EVENTS.forEach((ev, i) => {
    const layer = ev.layer || "cosmos";
    const L = LAYERS[layer] || LAYERS.cosmos;
    const sec = document.createElement("section");
    sec.className = "event layer-" + layer;
    sec.id = "ev" + i;
    const whenText = ev.when || formatTime(ev.ybp);
    const tag = layer === "cosmos" ? "" :
      `<div class="layer-tag reveal">${L.symbol} ${L.label}</div>`;
    sec.innerHTML = `${tag}
      <div class="icon reveal">${ev.icon}</div>
      <div class="when reveal">${whenText}</div>
      <h2 class="reveal">${ev.title}</h2>
      <p class="reveal">${ev.text}</p>
      <div class="trivia reveal">${ev.trivia}</div>`;
    eventsRoot.appendChild(sec);
    sections.push(sec);
    sec.querySelectorAll(".reveal").forEach(el => revealObserver.observe(el));

    const dot = document.createElement("div");
    dot.className = "rail-dot";
    dot.title = ev.title;
    dot.addEventListener("click", () => sec.scrollIntoView({ behavior: "smooth" }));
    rail.appendChild(dot);
    dots.push(dot);
  });
}

// 表示中のイベントのインデックス一覧
function visibleIndices() {
  return EVENTS.map((e, i) => i)
    .filter(i => (LAYERS[EVENTS[i].layer || "cosmos"] || { on: true }).on);
}

// ============================================================
// 星空キャンバス
// ============================================================
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let stars = [];
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  stars = Array.from({ length: Math.min(200, innerWidth / 4) }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.4 + 0.3,
    tw: Math.random() * Math.PI * 2,
    sp: 0.02 + Math.random() * 0.05
  }));
}
resize();
addEventListener("resize", resize);

function drawStars(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of stars) {
    const a = 0.35 + 0.5 * Math.abs(Math.sin(s.tw + (reduceMotion ? 0 : t * 0.001 * s.sp * 30)));
    ctx.globalAlpha = a;
    ctx.fillStyle = "#dfe3ff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (!reduceMotion) requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

// ============================================================
// スクロール処理:時間カウンター・背景色・進行バー
// ============================================================
const timeDisplay = document.getElementById("time-display");
const eraLabel = document.getElementById("era-label");
const glow = document.getElementById("glow");
const railFill = document.getElementById("rail-fill");

function onScroll() {
  if (!sections.length) return;
  const vis = visibleIndices();
  if (!vis.length) return;
  const mid = scrollY + innerHeight / 2;
  const cs = vis.map(i => {
    const r = sections[i].getBoundingClientRect();
    return r.top + scrollY + r.height / 2;
  });
  const evs = vis.map(i => EVENTS[i]);

  // ヒーロー領域ではHUDを薄く
  if (mid < cs[0] - innerHeight * 0.6) {
    timeDisplay.textContent = "";
    eraLabel.textContent = "";
  } else {
    // どの区間にいるか
    let i = 0;
    while (i < cs.length - 1 && mid > cs[i + 1]) i++;
    let ybp, era;
    if (mid <= cs[0]) {
      ybp = evs[0].ybp; era = evs[0].era;
    } else if (i >= cs.length - 1) {
      ybp = evs[evs.length - 1].ybp; era = evs[evs.length - 1].era;
    } else {
      const f = Math.min(1, Math.max(0, (mid - cs[i]) / (cs[i + 1] - cs[i])));
      const v = toLog(evs[i].ybp) + (toLog(evs[i + 1].ybp) - toLog(evs[i].ybp)) * f;
      ybp = fromLog(v);
      era = f < 0.5 ? evs[i].era : evs[i + 1].era;
    }
    timeDisplay.textContent = formatTime(ybp);
    eraLabel.textContent = era;
  }

  // 背景の色(近いイベントの色相を補間)
  let i2 = 0;
  while (i2 < cs.length - 1 && mid > cs[i2 + 1]) i2++;
  const f2 = i2 >= cs.length - 1 ? 0 : Math.min(1, Math.max(0, (mid - cs[i2]) / (cs[i2 + 1] - cs[i2])));
  const a = evs[Math.max(0, i2)], b = evs[Math.min(evs.length - 1, i2 + 1)];
  const hue = a.hue + (b.hue - a.hue) * f2;
  const sat = a.sat + (b.sat - a.sat) * f2;
  glow.style.background =
    `radial-gradient(ellipse 120% 70% at 50% 35%, hsla(${hue}, ${sat}%, 30%, 0.32), transparent 70%)`;

  // 進行バー
  const total = document.body.scrollHeight - innerHeight;
  const p = Math.min(1, Math.max(0, scrollY / total));
  railFill.style.height = (p * 100) + "%";
  vis.forEach((idx, k) => {
    dots[idx].classList.toggle("active", Math.abs(mid - cs[k]) < innerHeight * 0.55);
  });
}
addEventListener("scroll", onScroll, { passive: true });
onScroll();

// ============================================================
// 目次メニュー
// ============================================================
const menuBtn = document.getElementById("menu-btn");
const menuOverlay = document.getElementById("menu-overlay");
const menuClose = document.getElementById("menu-close");
const menuList = document.getElementById("menu-list");
const layerChips = document.getElementById("layer-chips");
let menuItems = [];

function buildMenu() {
  layerChips.innerHTML = "";
  menuList.innerHTML = "";
  menuItems = [];

  // レイヤー切り替えチップ
  Object.entries(LAYERS).forEach(([key, L]) => {
    const chip = document.createElement("button");
    chip.className = "layer-chip" + (L.on ? " on" : "");
    chip.textContent = L.symbol + " " + L.label;
    chip.addEventListener("click", () => {
      L.on = !L.on;
      chip.classList.toggle("on", L.on);
      updateLayers();
    });
    layerChips.appendChild(chip);
  });

  EVENTS.forEach((ev, i) => {
    const layer = ev.layer || "cosmos";
    const item = document.createElement("button");
    item.className = "menu-item mi-" + layer;
    item.innerHTML = `
      <span class="mi-icon">${ev.icon}</span>
      <span>
        <div class="mi-title">${ev.title}</div>
        <div class="mi-when">${ev.when || formatTime(ev.ybp)}・${ev.era}</div>
      </span>`;
    item.addEventListener("click", () => {
      menuOverlay.classList.remove("open");
      sections[i].scrollIntoView({ behavior: "smooth" });
    });
    menuList.appendChild(item);
    menuItems.push(item);
  });
}

// レイヤー表示の更新
function updateLayers() {
  const vis = visibleIndices();
  EVENTS.forEach((ev, i) => {
    const show = vis.includes(i);
    sections[i].style.display = show ? "" : "none";
    menuItems[i].style.display = show ? "" : "none";
    dots[i].style.display = show ? "" : "none";
  });
  vis.forEach((idx, k) => {
    dots[idx].style.top = (vis.length > 1 ? (k / (vis.length - 1)) * 100 : 50) + "%";
  });
  onScroll();
}

menuBtn.addEventListener("click", () => menuOverlay.classList.add("open"));
menuClose.addEventListener("click", () => menuOverlay.classList.remove("open"));
menuOverlay.addEventListener("click", e => {
  if (e.target === menuOverlay) menuOverlay.classList.remove("open");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") menuOverlay.classList.remove("open");
});

// ============================================================
// データ読み込みと初期化
// 同じフォルダに events.json があればそちらを使用します。
// {
//   "layers": { "personal": { "label": "あなた", "symbol": "👤", "color": "#7ee8c9" } },
//   "mode": "replace",   ← "replace"(全置換・既定) または "append"(内蔵データに追加)
//   "events": [ { "ybp": ..., "title": ..., ... } ]
// }
// events.json が無い場合は内蔵データで動作します(単一ファイルでもOK)。
// ============================================================
async function loadExternalData() {
  try {
    const res = await fetch("events.json", { cache: "no-store" });
    if (!res.ok) throw new Error("not found");
    const data = await res.json();
    if (data.layers) {
      Object.entries(data.layers).forEach(([key, L]) => {
        LAYERS[key] = Object.assign({ on: true }, LAYERS[key] || {}, L);
      });
    }
    if (Array.isArray(data.events) && data.events.length) {
      EVENTS = data.mode === "append" ? EVENTS.concat(data.events) : data.events;
      EVENTS.sort((a, b) => b.ybp - a.ybp);
    }
  } catch (e) {
    // events.json なし → 内蔵データで続行
  }
}

async function init() {
  await loadExternalData();
  injectLayerStyles();
  buildTimeline();
  buildMenu();
  updateLayers();
}
init();
</script>
